<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- Apply immersion chrome + theme before paint so first visits don't flash. -->
		<script>
			try {
				var mode = localStorage.getItem('kingdom:mode');
				if (mode !== 'script' && mode !== 'chronicle') {
					document.documentElement.classList.add('is-immersion');
				}
			} catch (_) {}
			try {
				var theme = localStorage.getItem('kingdom:theme');
				if (theme !== 'light' && theme !== 'dark') {
					theme =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
							? 'light'
							: 'dark';
				}
				document.documentElement.dataset.theme = theme;
			} catch (_) {}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Platypi:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
