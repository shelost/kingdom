<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/png" href="/crown.png" />
		<!-- Theme before paint. Mode is script from first paint — no stage classes. -->
		<script>
			try {
				var theme = localStorage.getItem('kingdom:theme');
				if (theme !== 'light' && theme !== 'dark') {
					theme =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
							? 'light'
							: 'dark';
				}
				document.documentElement.dataset.theme = theme;
				var lang = localStorage.getItem('kingdom:lang:v2');
				if (lang !== 'en' && lang !== 'ko' && lang !== 'both') lang = 'en';
				document.documentElement.dataset.lang = lang;
				if (lang !== 'en') document.documentElement.lang = 'ko';
			} catch (_) {}
			/* A refresh of the reader with a saved spot: hold a loader until the
			   reader lands back there (restoreReadingSpot lifts it), so the page
			   never flashes the foreword. The timeout is the no-JS safety net. */
			try {
				var nav = performance.getEntriesByType('navigation')[0];
				var spot = JSON.parse(sessionStorage.getItem('kingdom:reading-spot') || 'null');
				if (
					nav &&
					(nav.type === 'reload' || nav.type === 'back_forward') &&
					spot &&
					spot.href === location.pathname + location.search
				) {
					document.documentElement.classList.add('is-restoring');
					setTimeout(function () {
						document.documentElement.classList.remove('is-restoring');
					}, 4000);
				}
			} catch (_) {}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..700;1,300..700&family=Platypi:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&family=Nanum+Brush+Script&family=Black+Han+Sans&family=Yuji+Boku&family=LXGW+WenKai+TC:wght@700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
